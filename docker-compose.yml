version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: medimatchpro_db
    environment:
      POSTGRES_DB: medimatchpro
      POSTGRES_USER: medimatch
      POSTGRES_PASSWORD: medimatch123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  postgres_data: 